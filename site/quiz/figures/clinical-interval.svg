<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-label="Between-group estimate 25 percentage points, 95 percent confidence interval 5 to 45 points, clinical threshold 20 points."><rect width="480" height="230" fill="white"/><g font-family="system-ui,sans-serif" font-size="15" fill="#20343e"><text x="45" y="25">95% confidence interval</text><line x1="45" x2="45" y1="53" y2="158" stroke="#415663"/><line x1="205" x2="205" y1="53" y2="158" stroke="#704a93" stroke-width="2" stroke-dasharray="6 4"/><line x1="85" x2="405" y1="98" y2="98" stroke="#245e90" stroke-width="4"/><line x1="85" x2="85" y1="89" y2="107" stroke="#245e90" stroke-width="2"/><text x="85" y="81" text-anchor="middle">5</text><line x1="405" x2="405" y1="89" y2="107" stroke="#245e90" stroke-width="2"/><text x="405" y="81" text-anchor="middle">45</text><circle cx="245" cy="98" r="6" fill="#245e90"/><text x="245" y="81" text-anchor="middle">25</text><line x1="45" x2="445" y1="158" y2="158" stroke="#819ba8"/><text x="45" y="178" text-anchor="middle">0</text><text x="125" y="178" text-anchor="middle">10</text><text x="205" y="178" text-anchor="middle">20</text><text x="285" y="178" text-anchor="middle">30</text><text x="365" y="178" text-anchor="middle">40</text><text x="445" y="178" text-anchor="middle">50</text><text x="245" y="201" text-anchor="middle">Between-group difference (percentage points)</text><text x="45" y="225" fill="#67448c">Dashed line: clinical threshold of 20 points</text></g></svg>