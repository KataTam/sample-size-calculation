<title id="roadmap-title">Your route through the sample size tutorial: Core and Advanced</title>
<desc id="roadmap-desc">Two learning routes connect tutorial explanations, activities and apps. Core covers basic planning, calculations and simple simulation. Advanced extends these to further methods and designs. Flashcards support both routes. Each block links to its resource.</desc>
