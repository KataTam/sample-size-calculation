<circle class="question-circle" cx="232" cy="226" r="137" fill="#eee8f3" stroke="transparent" stroke-width="5" aria-hidden="true"/>
<text text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#17242d" aria-hidden="true"><tspan x="232" y="145.5">What is the</tspan><tspan x="232" y="168.5">degree of risk that</tspan><tspan x="232" y="191.5">you are willing to</tspan><tspan x="232" y="214.5">accept to conclude that</tspan><tspan x="232" y="237.5">a treatment difference</tspan><tspan x="232" y="260.5">exists when in fact it</tspan><tspan x="232" y="283.5">doesn't (risk of</tspan><tspan x="232" y="306.5">type I error)?</tspan></text>
