<title id="question-map-title">Seven questions for determining the minimum required sample size</title>
<desc id="question-map-description">Seven questions surround the minimum required sample size: primary outcome; expected effect with standard treatment; expected effect with novel treatment; clinically relevant difference; null and alternative hypotheses; risk of a Type I error; and risk of a Type II error at a specified true difference. Activate an information link to read the explanation below the map.</desc>
<style>.question-link {cursor:pointer;} .question-link:hover .info-disc, .question-link:focus-visible .info-disc {fill:#73217d;} .question-link:focus-visible .question-circle {stroke:#73217d;stroke-width:5;} .question-link:focus-visible .info-ring {stroke:#73217d;stroke-width:4;}</style>
