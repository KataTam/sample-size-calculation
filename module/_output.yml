bookdown::gitbook:
  css: styles.css
  toc_depth: 3
  code_folding: none
  includes:
    after_body: [toolbar-help.html, glossary-support.html]
  split_by: chapter
  split_bib: false
  config:
    toc:
      collapse: none
      scroll_highlight: true
      before: |
        <li><a href="./">Sample size for clinical studies</a></li>
    search: true
    sharing: false
    download: [["Sample_size_open_module.html", "Standalone HTML"], ["Sample_size_open_module.pdf", "Printable PDF"]]
