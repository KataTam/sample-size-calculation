name: Build and publish resource
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # The locked R dependencies are validated on this runner (later 1.4.4 fails on Ubuntu 26).
    runs-on: ubuntu-24.04
    env:
      BUILD_PDF: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Recover an unavailable Ubuntu package mirror
        shell: bash
        run: |
          # Keep APT signature verification and the runner's normal mirror when reachable.
          if [ -f /etc/apt/apt-mirrors.txt ] && ! curl --fail --silent --show-error --location --connect-timeout 5 --max-time 12 --output /dev/null http://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease; then
            mirror=https://mirror.math.princeton.edu/pub/ubuntu/
            curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --output /dev/null "${mirror}dists/noble/InRelease"
            printf '%s\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Check source text
        run: python3 scripts/check_text.py
      - uses: r-lib/actions/setup-renv@v2
      - name: Check statistical functions and apps
        run: Rscript scripts/check_resource.R
      - name: Render tutorial
        run: Rscript scripts/render_resource.R --html
      - name: Export browser apps
        run: Rscript scripts/export_shinylive.R
      - name: Assemble website and source download
        run: |
          python3 -m pip install -r scripts/flashcard-requirements.txt
          python3 scripts/build_site.py --defer-link-checks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare complete tutorial export
        run: |
          python3 -m pip install -r scripts/pdf-requirements.txt
          npm install --no-save --package-lock=false playwright axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Check developing report and saved quiz attempts
        run: node scripts/check_report_journey.cjs --source
      - name: Export complete tutorial HTML and PDF
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 --directory _site > /tmp/tutorial-preview.log 2>&1 &
          node scripts/export_tutorial.cjs
          python3 scripts/check_book_pdf.py
          python3 scripts/check_links.py
          node scripts/check_design_rules.cjs
          node scripts/check_design_browser.cjs
          node scripts/check_chapter_navigation.cjs
          node scripts/check_tutorial_search.cjs
          node scripts/check_quiz.cjs
          node scripts/check_embedded_quiz.cjs
          node scripts/check_core_activities.cjs
          node scripts/check_app_previews.cjs
          node scripts/check_inline_apps.cjs
          node scripts/check_learning_interfaces.cjs
          node scripts/check_assumptions_report.cjs http://127.0.0.1:8769
          node scripts/check_report_exports.cjs
          python3 scripts/check_report_files.py
          node scripts/check_accessibility.cjs
          node scripts/check_reader_tools.cjs
          node scripts/check_contents_resize.cjs
          node scripts/check_boundary_drag.cjs
          node scripts/check_error_activities.cjs
          node scripts/check_glossary_tools.cjs
          node scripts/check_week2.cjs
          node scripts/check_advanced_headings.cjs http://127.0.0.1:8769
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
