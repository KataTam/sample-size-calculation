name: Build and publish resource
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_PDF: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Check source text
        run: python3 scripts/check_text.py
      - uses: r-lib/actions/setup-renv@v2
      - name: Check statistical functions and apps
        run: Rscript scripts/check_resource.R
      - name: Render tutorial
        run: Rscript scripts/render_resource.R --html
      - name: Export browser apps
        run: Rscript scripts/export_shinylive.R
      - name: Assemble website and source download
        run: python3 scripts/build_site.py --defer-link-checks
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare complete tutorial export
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Export complete tutorial HTML and PDF
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 --directory _site > /tmp/tutorial-preview.log 2>&1 &
          node scripts/export_tutorial.cjs
          python3 scripts/check_links.py
          node scripts/check_reader_tools.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
